<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NZWSえみゅ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}
label { display:block; margin-top:15px; font-size:18px; }
input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: none;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  margin-top: 15px;
  padding: 12px 20px;
  font-size: 18px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  background: #28a5ff;
  color: #fff;
}
button:hover { opacity:0.8; }
.btn-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 25px;
}
.btn-next {
  background: #22c55e;
}
.container {
  max-width: 600px;
  margin: auto;
}
.filename-display {
  font-size: 22px;
  font-weight: bold;
  color: #28a5ff;
  margin-top: 8px;
}
.section-title {
  font-size: 22px;
  font-weight: bold;
  margin-top: 30px;
  border-bottom: 2px solid #28a5ff;
  padding-bottom: 6px;
}
</style>

</head>
<body>

<div class="container">
  <h1>NZWSえみゅ</h1>

  <div class="section-title">📄 ファイル名</div>

  <label>ファイル名（数字）</label>
  <input id="filename" type="number" placeholder="例: 39" oninput="updateFilenameDisplay()">
  <div class="filename-display" id="filenameDisplay">--.html</div>

  <div class="section-title">📝 コンテンツ</div>

  <label>ジャンル</label>
  <select id="genre">
    <option value="g">g</option>
    <option value="e">e</option>
    <option value="o">o</option>
  </select>

  <label>タイトル</label>
  <input id="title" placeholder="タイトルを入力">

  <label>動画リンク</label>
  <input id="video_url" placeholder="https://...">

  <label>画像リンク</label>
  <input id="image_url" placeholder="https://...">

  <label>解説</label>
  <textarea id="desc" rows="5" placeholder="解説を書く"></textarea>

  <label>関連リンク1</label>
  <input id="link1" placeholder="https://...">

  <label>関連リンク2</label>
  <input id="link2" placeholder="https://...">

  <div class="btn-row">
    <button onclick="generateHTML()">⬇️ 生成してダウンロード</button>
    <button class="btn-next" onclick="generateAndNext()">⬇️ 生成して次の番号へ</button>
  </div>
</div>


<script>
// ページ読み込み時にlocalStorageから番号を復元
window.addEventListener('load', () => {
  const saved = localStorage.getItem('nzws_last_filename');
  if (saved) {
    document.getElementById('filename').value = saved;
    updateFilenameDisplay();
  }
});

function updateFilenameDisplay() {
  const val = document.getElementById('filename').value.trim();
  document.getElementById('filenameDisplay').textContent = val ? val + '.html' : '--.html';
}

function buildTemplate(title, genre, videoURL, imageURL, desc, link1, link2) {
  // video urlがtwimg.comを含む場合はreferrerpolicyを追加
  const videoATag = `<a href="${videoURL}" target="_blank" referrerpolicy="no-referrer">`;

  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>${title}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: url("haikei.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }

  .layout {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 20px;
  }

  .main-content {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 200px;
    height: auto;
    display: block;
    margin-bottom: 20px;
  }

  .video-block {
    margin-bottom: 30px;
    width: 100%;
    max-width: 900px;
    background: rgba(0,0,0,0.5);
    padding: 15px;
    border-radius: 10px;
  }

  .video-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .line {
    width: 90%;
    height: 2px;
    background: #fff;
    margin: 10px auto;
  }

  .video-block a img {
    width: 100%;
    max-width: 450px;
    height: auto;
    border: 2px solid #fff;
    border-radius: 8px;
    margin-top: 10px;
  }

  .video-desc {
    font-size: 22px;
    margin-top: 10px;
    color: #f0f0f0;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .links a {
    color: #49a1ff;
    font-size: 20px;
    margin: 10px 0;
    text-decoration: none;
  }

  .links a:hover {
    text-decoration: underline;
  }

  @media (max-width: 900px) {
    .layout {
      flex-direction: column;
      align-items: center;
    }
    .video-title { font-size: 26px; }
    .video-desc { font-size: 18px; }
  }
</style>
</head>

<body>

<div class="layout">
  <div class="main-content">

    <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">
      <img src="NZWS.png" class="logo" alt="logo">
    </a>

    <div class="video-tag" data-tag="${genre}"></div>

    <div class="video-block">
      <div class="video-title">${title}</div>
      <div class="line"></div>
      <div class="click-hint">画像クリックで再生</div>

      ${videoATag}
        <img src="${imageURL}" alt="thumbnail">
      </a>

      <div class="line"></div>
      <div class="video-desc">${desc}</div>
    </div>

    <div class="links">
      <a href="${link1}" target="_blank" referrerpolicy="no-referrer">関連リンク1</a>
      <a href="${link2}" target="_blank" referrerpolicy="no-referrer">関連リンク2</a>
      <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">ホームへ</a>
    </div>

  </div>
</div>

</body>
</html>`;
}

function generateHTML(autoNext = false) {
  const filename  = document.getElementById("filename").value.trim();
  const genre     = document.getElementById("genre").value;
  const title     = document.getElementById("title").value.trim();
  const videoURL  = document.getElementById("video_url").value.trim();
  const imageURL  = document.getElementById("image_url").value.trim();
  const desc      = document.getElementById("desc").value.trim();
  const link1     = document.getElementById("link1").value.trim();
  const link2     = document.getElementById("link2").value.trim();

  if (!filename || !title) {
    alert("ファイル名とタイトルは必須です");
    return false;
  }

  const html = buildTemplate(title, genre, videoURL, imageURL, desc, link1, link2);

  const blob = new Blob([html], {type: "text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename + ".html";
  a.click();

  // 番号をlocalStorageに保存
  localStorage.setItem('nzws_last_filename', filename);

  return true;
}

function generateAndNext() {
  const success = generateHTML(true);
  if (!success) return;

  const current = parseInt(document.getElementById("filename").value.trim());
  if (!isNaN(current)) {
    const next = current + 1;
    document.getElementById("filename").value = next;
    localStorage.setItem('nzws_last_filename', String(next));
    updateFilenameDisplay();
  }
}
</script>

</body>
</html>
