<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NZWSえみゅ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}
label { display:block; margin-top:15px; font-size:18px; }
input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: none;
  font-size: 16px;
}
button {
  margin-top: 25px;
  padding: 12px 20px;
  font-size: 18px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  background: #28a5ff;
  color: #fff;
}
button:hover { opacity:0.8; }
.container {
  max-width: 600px;
  margin: auto;
}
</style>

</head>
<body>

<div class="container">
  <h1>NZWSえみゅ</h1>

  <label>ファイル名（拡張子不要）</label>
  <input id="filename" placeholder="example → myvideo">

  <label>ジャンル</label>
  <select id="genre">
    <option value="g">g</option>
    <option value="e">e</option>
    <option value="o">o</option>
  </select>

  <label>タイトル</label>
  <input id="title" placeholder="タイトルを入力">

  <label>動画リンク</label>
  <input id="video_url" placeholder="https://...">

  <label>画像リンク</label>
  <input id="image_url" placeholder="https://...">

  <label>解説</label>
  <textarea id="desc" rows="5" placeholder="解説を書く"></textarea>

  <label>関連リンク1</label>
  <input id="link1" placeholder="https://...">

  <label>関連リンク2</label>
  <input id="link2" placeholder="https://...">

  <button onclick="generateHTML()">生成してダウンロード</button>
</div>


<script>
function generateHTML() {

  const filename  = document.getElementById("filename").value.trim();
  const genre     = document.getElementById("genre").value;
  const title     = document.getElementById("title").value.trim();
  const videoURL  = document.getElementById("video_url").value.trim();
  const imageURL  = document.getElementById("image_url").value.trim();
  const desc      = document.getElementById("desc").value.trim();

  const link1     = document.getElementById("link1").value.trim();
  const link2     = document.getElementById("link2").value.trim();

  if (!filename || !title) {
    alert("ファイル名とタイトルは必須です");
    return;
  }

  const template = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>${title}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: url("haikei.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }

  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
  }

  .side-ad {
    width: 160px;
    height: 600px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .main-content {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 200px;
    height: auto;
    display: block;
    margin-bottom: 20px;
  }

  .video-block {
    margin-bottom: 30px;
    width: 100%;
    max-width: 900px;
    background: rgba(0,0,0,0.5);
    padding: 15px;
    border-radius: 10px;
  }

  .video-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .line {
    width: 90%;
    height: 2px;
    background: #fff;
    margin: 10px auto;
  }

  .video-block a img {
    width: 100%;
    max-width: 450px;
    height: auto;
    border: 2px solid #fff;
    border-radius: 8px;
    margin-top: 10px;
  }

  .video-desc {
    font-size: 22px;
    margin-top: 10px;
    color: #f0f0f0;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .links a {
    color: #49a1ff;
    font-size: 20px;
    margin: 10px 0;
    text-decoration: none;
  }

  .links a:hover {
    text-decoration: underline;
  }

  @media (max-width: 900px) {
    .layout {
      flex-direction: column;
      align-items: center;
    }
    .side-ad {
      display: none;
    }
    .video-title { font-size: 26px; }
    .video-desc { font-size: 18px; }
  }
</style>
</head>

<body>

<div class="layout">
  <div class="side-ad">
    <script src="https://adm.shinobi.jp/s/4afb858c82a32781f7e32122fcce5312"><\/script>
  </div>

  <div class="main-content">

    <a href="https://nzworldsearch.github.io/NZWS/" target="_blank">
      <img src="NZWS.png" class="logo" alt="logo">
    </a>

    <div class="video-tag" data-tag="${genre}"></div>

    <div class="video-block">
      <div class="video-title">${title}</div>
      <div class="line"></div>
      <div class="click-hint">画像クリックで再生</div>

      <a href="${videoURL}" target="_blank">
        <img src="${imageURL}" alt="thumbnail">
      </a>

      <div class="line"></div>
      <div class="video-desc">${desc}</div>
    </div>

  <div style="text-align: center;">
  <script src="https://adm.shinobi.jp/s/a9a816c8541888b4033a461969c74db7"><\/script>
</div>

    <div class="links">
      <a href="${link1}" target="_blank">関連リンク1</a>
      <a href="${link2}" target="_blank">関連リンク2</a>
      <a href="https://nzworldsearch.github.io/NZWS/" target="_blank">ホームへ</a>
    </div>

  </div>

  <div class="side-ad">
    <script src="https://adm.shinobi.jp/s/4afb858c82a32781f7e32122fcce5312"><\/script>
  </div>

</div>

</body>
</html>`;

  const blob = new Blob([template], {type: "text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename + ".html";
  a.click();
}
</script>

</body>
</html>
