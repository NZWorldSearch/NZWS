<style>
  body {
    margin: 0;
    background: url("haikei.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }

  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
  }

  .side-ad {
    width: 160px;
    height: 600px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .main-content {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ←ここ修正：ロゴ固定サイズ */
  .logo {
    width: 200px;   /* 元の大きさ */
    height: auto;
    display: block;
    margin-bottom: 20px;
  }

  .video-block {
    margin-bottom: 30px;
    width: 100%;
    max-width: 900px;
    background: rgba(0,0,0,0.5);
    padding: 15px;
    border-radius: 10px;
  }

  .video-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .line {
    width: 90%;
    height: 2px;
    background: #fff;
    margin: 10px auto;
  }

  .video-block a img {
    width: 100%;
    max-width: 450px;
    height: auto;
    border: 2px solid #fff;
    border-radius: 8px;
    margin-top: 10px;
  }

  .video-desc {
    font-size: 22px;
    margin-top: 10px;
    color: #f0f0f0;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .links a {
    color: #49a1ff;
    font-size: 20px;
    margin: 10px 0;
    text-decoration: none;
  }

  .links a:hover {
    text-decoration: underline;
  }

  @media (max-width: 900px) {
    .layout {
      flex-direction: column;
      align-items: center;
    }
    .side-ad {
      display: none;
    }
    .video-title { font-size: 26px; }
    .video-desc { font-size: 18px; }
  }
</style>
</head>
