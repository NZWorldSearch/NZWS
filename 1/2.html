
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NakazawaWorldSearch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <div class="video-tag" data-tag="g"></div>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
  }
  .side-ad {
    width: 160px;
    height: 600px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .main-content {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: 200px;
    display: block;
    margin-bottom: 20px;
  }
  .video-block {
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .video-title {
    font-size: 20px;
    margin-bottom: 5px;
  }
  .video-desc {
    font-size: 16px;
    margin-top: 5px;
    margin-bottom: 10px;
    color: #ccc;
  }
  .thumbs a img {
    width: 200px;
    height: 120px;
    object-fit: cover;
    border: 2px solid #fff;
    border-radius: 6px;
    cursor: pointer;
  }

  .thumbs a img,
  .logo,
  .video-block a img {
    max-width: 100%;
    height: auto;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .links a {
    color: #49a1ff;
    font-size: 20px;
    margin: 10px 0;
    text-decoration: none;
  }
  .links a:hover {
    text-decoration: underline;
  }
  @media (max-width: 900px) {
    .layout {
      flex-direction: column;
      align-items: center;
    }
    .side-ad {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="layout">
  

  <div class="main-content">

    <!-- ★ロゴにリンクを追加 -->
    <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">
      <img src="NZWS.png" class="logo" alt="logo">
    </a>

    <div class="video-block">
      <div class="video-title">ブラジルのジムでバーベルが落下、男性が死亡</div>
      <a href="https://theync.com/media/videos/6/9/3/1/2/693127246f71c.mp4" target="_blank" referrerpolicy="no-referrer">
        <img src="https://theync.com/media/thumbs/6/9/3/1/2/5524336931266390496.mp4/5524336931266390496.mp4-3.jpg" alt="video1">
      </a>
      <div class="video-desc">この後にこの男性は死にました。バーベルの持ち方があまりよくありませんよね、親指をうまく使っていれば大丈夫だったかもしれません。無理のない範囲で筋トレはしましょう。#筋トレ</div>
    </div>

<div class="links">
      <a href="https://example.com/link1" target="_blank" referrerpolicy="no-referrer">関連リンク1</a>
      <a href="https://example.com/link2" target="_blank" referrerpolicy="no-referrer">関連リンク2</a>
      <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">ホームへ</a>
    </div>
  </div>

  
</div>

</body>
</html>
