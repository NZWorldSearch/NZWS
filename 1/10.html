<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NakazawaWorldSearch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: url("haikei.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }

  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
  }

  .side-ad {
    width: 160px;
    height: 600px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .main-content {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ←ここ修正：ロゴ固定サイズ */
  .logo {
    width: 200px;   /* 元の大きさ */
    height: auto;
    display: block;
    margin-bottom: 20px;
  }

  .video-block {
    margin-bottom: 30px;
    width: 100%;
    max-width: 900px;
    background: rgba(0,0,0,0.5);
    padding: 15px;
    border-radius: 10px;
  }

  .video-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .line {
    width: 90%;
    height: 2px;
    background: #fff;
    margin: 10px auto;
  }

  .video-block a img {
    width: 100%;
    max-width: 450px;
    height: auto;
    border: 2px solid #fff;
    border-radius: 8px;
    margin-top: 10px;
  }

  .video-desc {
    font-size: 22px;
    margin-top: 10px;
    color: #f0f0f0;
  }

  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .links a {
    color: #49a1ff;
    font-size: 20px;
    margin: 10px 0;
    text-decoration: none;
  }

  .links a:hover {
    text-decoration: underline;
  }

  @media (max-width: 900px) {
    .layout {
      flex-direction: column;
      align-items: center;
    }
    .side-ad {
      display: none;
    }
    .video-title { font-size: 26px; }
    .video-desc { font-size: 18px; }
  }
</style>
</head>

<body>

<div class="layout">
  

  <div class="main-content">

    <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">
      <img src="NZWS.png" class="logo" alt="logo">
    </a>

  <!-- ジャンル g e o  -->
  <div class="video-tag" data-tag="g"></div>


    <div class="video-block">
                                   <!-- タイトル↓  -->
      <div class="video-title">【閲覧禁止】生きたメキシコ本物</div>
      <div class="line"></div>
      <div class="click-hint">画像クリックで再生</div>
               <!-- 動画リンク  -->
      <a href="https://www.gorecenter.com/wp-content/uploads/2023/02/No-mercy-in-Mexico.mp4?id=0" target="_blank" referrerpolicy="no-referrer">
                     <!-- サムネ↓  -->
        <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Funitedlatestnews.com%2Fwp-content%2Fuploads%2F2023%2F07%2FNo-Mercy-in-Mexico-150x78.png&f=1&nofb=1&ipt=e2520f7ac97a04e255bb39d9920d8032729118f394b49fa9364ecbb07908b5d5" alt="video1">
      </a>

      <div class="line"></div>
                                 <!-- 解説＆タグ  -->
      <div class="video-desc">メキシカンですねえー検索してはいけないで有名な生きたメキシコです#検索してはいけない #拷問</div>
    </div>

  

    <div class="links">
      <a href="https://example.com/link1" target="_blank" referrerpolicy="no-referrer">関連リンク1</a>
      <a href="https://example.com/link2" target="_blank" referrerpolicy="no-referrer">関連リンク2</a>
      <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">ホームへ</a>
    </div>



</div>

<script id="dsq-count-scr" src="//https-nzworldsearch-github-io.disqus.com/count.js" async></script>

</body>
</html>

<script>
  // ページ内の video-title を取得
  const titleElement = document.querySelector(".video-title");

  // 存在していれば document.title にセット
  if (titleElement) {
    document.title = titleElement.textContent.trim();
  }

</script>
