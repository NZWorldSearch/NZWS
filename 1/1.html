<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Blog Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
  }
  /* 左右広告スペース */
  .side-ad {
    width: 160px;
    height: 600px;
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  /* 中央コンテンツ */
  .main-content {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center; /* 中央寄せ */
  }
  /* ロゴ */
  .logo {
    width: 200px;
    display: block;
    margin-bottom: 20px;
  }
  /* 動画ブロック */
  .video-block {
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center; /* 中央寄せ */
  }
  .video-title {
    font-size: 20px;
    margin-bottom: 5px;
  }
  .video-desc {
    font-size: 16px;
    margin-top: 5px;
    margin-bottom: 10px;
    color: #ccc;
  }
  .thumbs a img {
    width: 200px;
    height: 120px;
    object-fit: cover;
    border: 2px solid #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  /* 関連リンク */
  .links {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center; /* 中央寄せ */
  }
  .links a {
    color: #49a1ff;
    font-size: 20px;
    margin: 10px 0;
    text-decoration: none;
  }
  .links a:hover {
    text-decoration: underline;
  }
  /* レスポンシブ対応 */
  @media (max-width: 900px) {
    .layout {
      flex-direction: column;
      align-items: center;
    }
    .side-ad {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- 左広告 -->
  

  <!-- 中央コンテンツ -->
  <div class="main-content">

    <!-- ロゴ -->
    <img src="NZWS.png" class="logo" alt="logo">

    <!-- 動画ブロック例 -->
    <div class="video-block">
      <div class="video-title">目隠しされた男性が成敗される</div>
      <a href="https://theync.com/media/videos/6/9/2/d/b/692db313a1e40.mp4" target="_blank" referrerpolicy="no-referrer">
        <img src="https://theync.com/media/thumbs/6/9/2/d/b/2177685692db1e83f6a5.mp4/2177685692db1e83f6a5.mp4-9.jpg" alt="video1">
      </a>
      <div class="video-desc">この男性は泥棒をしたようです</div>
    </div>

    <!-- 関連リンク -->
    <div class="links">
      <a href="https://example.com/link1" target="_blank" referrerpolicy="no-referrer">関連リンク1</a>
      <a href="https://example.com/link2" target="_blank" referrerpolicy="no-referrer">関連リンク2</a>
      <a href="https://nzworldsearch.github.io/NZWS/" target="_blank" referrerpolicy="no-referrer">ホームへ</a>
    </div>

  </div>

  <!-- 右広告 -->
  
</div>

</body>
</html>
