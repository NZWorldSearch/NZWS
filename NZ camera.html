<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NZC Pro</title>
    <style>
        /* 全体のスタイル設定（黒背景・赤文字） */
        body {
            background-color: black;
            color: red;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロール禁止 */
            width: 100vw;
            height: 100vh;
            touch-action: manipulation; /* ダブルタップズーム防止 */
        }

        /* 共通UIパーツ */
        .screen {
            display: none;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        .active { display: block; }

        h1 {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 2em;
            letter-spacing: 5px;
        }

        h2 {
            text-align: center;
            border: 2px solid red;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            background: black;
            color: red;
            border: 2px solid red;
            padding: 15px;
            width: 100%;
            font-size: 1.2rem;
            margin-bottom: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        button:active {
            background: red;
            color: black;
        }

        input, select {
            background: black;
            color: red;
            border: 1px solid red;
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        /* 隠しファイル入力 */
        #decrypt-input { display: none; }

        /* 撮影モード（真っ暗・フルスクリーンレイヤー） */
        #camera-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
            display: none;
            cursor: none;
        }

        /* 操作エリア（通常モード用） */
        #touch-video-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 10000;
        }
        #touch-photo-area {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 10000;
        }

        /* 処理用ビデオ要素（画面には出さないがレンダリングはさせる） */
        #hidden-processing-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -1;
        }

        /* プレビュー設定画面 */
        video#preview-video {
            width: 100%;
            border: 1px solid red;
            margin-bottom: 10px;
            transform: scaleX(1);
        }

        /* フォルダ画面 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .gallery-item {
            border: 1px solid red;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
        }
        .gallery-item.selected {
            border: 3px solid white;
        }
        .gallery-item img, .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .disclaimer {
            margin-top: 20px;
            border: 3px double red;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 0.8rem;
        }

        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <h1>NZC</h1>
        <button onclick="startNormalMode()">開始</button>
        <button onclick="startQuickVMode()">Quick V</button>
        
        <div style="height: 20px;"></div>
        
        <button onclick="showSettings()">設定</button>
        <button onclick="showFolder()">フォルダ</button>
        <button onclick="showUsage()">使用方法</button>
        
        <div style="margin-top: 20px; border-top: 1px solid red; padding-top: 20px;">
            <button onclick="triggerDecrypt()" style="font-size: 0.9rem;">暗号化解除</button>
            <input type="file" id="decrypt-input" onchange="decryptFile(this)">
        </div>
    </div>

    <div id="camera-overlay">
        <div id="touch-video-area"></div>
        <div id="touch-photo-area"></div>
    </div>

    <video id="hidden-processing-video" autoplay playsinline muted></video>

    <div id="settings-screen" class="screen">
        <h2>設定</h2>
        <video id="preview-video" autoplay playsinline muted></video>
        
        <label>画質:</label>
        <select id="quality-select" onchange="initCamera(true)">
            <option value="ideal">標準 (HD)</option>
            <option value="max">高画質 (FHD/4K)</option>
            <option value="low">低画質 (SD)</option>
        </select>

        <label>カメラ:</label>
        <select id="camera-select" onchange="initCamera(true)"></select>

        <label style="display:block; margin: 15px 0; cursor: pointer; display: flex; align-items: center;">
            <input type="checkbox" id="date-record-toggle" style="width:20px; height:20px; margin-right:10px;"> 
            <span>ファイル名に日付を使用</span>
        </label>

        <button onclick="goHome()">戻る</button>
    </div>

    <div id="folder-screen" class="screen">
        <h2>フォルダ</h2>
        <div style="margin-bottom: 10px; display: flex; gap: 5px;">
            <button onclick="downloadSelected(false)" style="flex: 1; font-size:0.8rem;">保存</button>
            <button onclick="downloadSelected(true)" style="flex: 1; font-size:0.8rem;">暗号化保存</button>
            <button onclick="deleteSelected()" style="flex: 1; font-size:0.8rem;">削除</button>
        </div>
        <div id="gallery" class="gallery-grid"></div>
        <br>
        <button onclick="goHome()">戻る</button>
    </div>

    <div id="usage-screen" class="screen">
        <h2>使用方法</h2>
        <div style="text-align: left; font-size: 0.9rem;">
            <p><b>【開始】</b><br>
            画面が真っ暗になります。<br>
            ・上半分タップ/音量大: 動画録画 (短振動=開始, 長振動=停止)<br>
            ・下半分タップ/音量小: 写真撮影 (短振動)</p>
            
            <p><b>【Quick V】</b><br>
            押すと即座に真っ暗になり、<b>自動で録画開始</b>します。<br>
            画面操作は無効です。<br>
            終了するには再読み込みしてください。</p>
            
            <p><b>【chrome推奨】</b><br>
            Safariやその他ブラウザの場合動作しない場合があります。</p>
        </div>
        <div class="disclaimer">悪用厳禁</div>
        <button onclick="goHome()">戻る</button>
    </div>

    <canvas id="hidden-canvas"></canvas>

    <script>
        // --- 設定・状態管理 ---
        const DB_NAME = "NZC_DB_v3";
        const STORE_NAME = "media";
        let db;
        
        let currentStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let isQuickMode = false; // Quick Vモードフラグ

        let settings = {
            quality: 'ideal',
            deviceId: null,
            recordDate: false
        };

        // --- IndexedDB (保存機能) ---
        function initDB() {
            const request = indexedDB.open(DB_NAME, 2);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = (e) => { db = e.target.result; };
        }

        function saveMedia(blob, type) {
            const transaction = db.transaction([STORE_NAME], "readwrite");
            const store = transaction.objectStore(STORE_NAME);
            store.add({
                type: type,
                blob: blob,
                timestamp: Date.now(),
                hasDate: document.getElementById('date-record-toggle').checked
            });
            // 通知（alert）は削除済み
        }

        // --- バイブレーション機能 ---
        function vibrate(type) {
            if (!navigator.vibrate) return;
            if (type === 'short') navigator.vibrate(50); // 写真・録画開始
            if (type === 'long') navigator.vibrate(800); // 録画終了
        }

        // --- 画面遷移とフルスクリーン ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goHome() {
            stopCamera();
            showScreen('menu-screen');
            document.getElementById('camera-overlay').style.display = 'none';
            if (document.fullscreenElement) document.exitFullscreen().catch(e=>{});
            isQuickMode = false;
        }

        async function enterFullScreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) { console.log("Fullscreen blocked"); }
        }

        // --- カメラ初期化プロセス ---
        async function getCameras() {
            const select = document.getElementById('camera-select');
            select.innerHTML = "";
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                videoDevices.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.text = d.label || `Camera ${select.length + 1}`;
                    select.appendChild(opt);
                });
            } catch (e) {}
        }

        async function initCamera(isPreview = false) {
            stopCamera(); // 既存ストリーム停止

            settings.quality = document.getElementById('quality-select').value;
            settings.deviceId = document.getElementById('camera-select').value;

            let w, h;
            if (settings.quality === 'max') { w = 1920; h = 1080; }
            else if (settings.quality === 'low') { w = 640; h = 480; }
            else { w = 1280; h = 720; }

            const constraints = {
                video: {
                    deviceId: settings.deviceId ? { exact: settings.deviceId } : undefined,
                    width: { ideal: w },
                    height: { ideal: h },
                    facingMode: settings.deviceId ? undefined : 'environment'
                },
                audio: true
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                if (isPreview) {
                    const v = document.getElementById('preview-video');
                    v.srcObject = currentStream;
                } else {
                    // 本番用隠しビデオタグにセット
                    const v = document.getElementById('hidden-processing-video');
                    v.srcObject = currentStream;
                    // 再生を確実に開始させる
                    await v.play(); 
                }
            } catch (err) {
                alert("カメラ起動失敗: " + err.message);
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            isRecording = false;
        }

        // --- モード制御 ---

        // 1. 通常モード開始
        async function startNormalMode() {
            await enterFullScreen();
            await initCamera(false);
            if (!currentStream) return;

            document.getElementById('camera-overlay').style.display = 'block';
            isQuickMode = false;
            
            // タッチイベント有効化
            document.getElementById('touch-video-area').onclick = toggleVideoRecord;
            document.getElementById('touch-photo-area').onclick = takePhoto;
            
            // 音量ボタンリスナー開始
            window.addEventListener('keydown', handleVolumeKey);
        }

        // 2. Quick V モード開始
        async function startQuickVMode() {
            await enterFullScreen();
            await initCamera(false);
            if (!currentStream) return;

            document.getElementById('camera-overlay').style.display = 'block';
            isQuickMode = true;

            // タッチイベント無効化（何もしない関数を割り当て）
            document.getElementById('touch-video-area').onclick = null;
            document.getElementById('touch-photo-area').onclick = null;

            // 自動録画開始
            startVideo();
        }

        // --- 撮影機能 ---

        // 写真撮影
        function takePhoto() {
            // Quickモードなら無視
            if (isQuickMode && isRecording) return; 

            const video = document.getElementById('hidden-processing-video');
            if (!video || video.readyState < 2) return;

            const canvas = document.getElementById('hidden-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            canvas.toBlob(blob => {
                if (blob) {
                    saveMedia(blob, 'image');
                    vibrate('short'); // 撮影時振動
                }
            }, 'image/jpeg', 0.9);
        }

        // 動画録画トグル
        function toggleVideoRecord() {
            if (isRecording) stopVideo();
            else startVideo();
        }

        function startVideo() {
            if (!currentStream) return;
            recordedChunks = [];
            
            // MIMEタイプ決定
            let mime = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mime = 'video/webm;codecs=vp9';

            try {
                mediaRecorder = new MediaRecorder(currentStream, { mimeType: mime });
            } catch (e) {
                mediaRecorder = new MediaRecorder(currentStream);
            }

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                saveMedia(blob, 'video');
                vibrate('long'); // 終了時 長振動
            };

            mediaRecorder.start();
            isRecording = true;
            vibrate('short'); // 開始時 短振動
        }

        function stopVideo() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        // --- 音量ボタンハック (実験的) ---
        function handleVolumeKey(e) {
            // Quickモード中は反応させない（あるいは停止させる？）
            // 要望ではQuick Vは「どこ押しても反応しない」なので無視する
            if (isQuickMode) return;

            const k = e.key;
            // 音量アップ -> 動画
            if (k === 'AudioVolumeUp' || k === 'VolumeUp') {
                e.preventDefault();
                toggleVideoRecord();
            }
            // 音量ダウン -> 写真
            else if (k === 'AudioVolumeDown' || k === 'VolumeDown') {
                e.preventDefault();
                takePhoto();
            }
        }

        // --- ギャラリー・ダウンロードなど (UIロジック) ---
        function showSettings() { showScreen('settings-screen'); getCameras(); initCamera(true); }
        function showFolder() { showScreen('folder-screen'); loadGallery(); }
        function showUsage() { showScreen('usage-screen'); }

        let selectedIds = new Set();
        function loadGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "";
            selectedIds.clear();
            const tx = db.transaction([STORE_NAME], "readonly");
            const store = tx.objectStore(STORE_NAME);
            store.openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const item = cursor.value;
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.onclick = () => {
                        if (selectedIds.has(item.id)) {
                            selectedIds.delete(item.id);
                            div.classList.remove('selected');
                        } else {
                            selectedIds.add(item.id);
                            div.classList.add('selected');
                        }
                    };
                    const url = URL.createObjectURL(item.blob);
                    if (item.type === 'image') div.innerHTML = `<img src="${url}">`;
                    else div.innerHTML = `<video src="${url}"></video>`;
                    gallery.appendChild(div);
                    cursor.continue();
                }
            };
        }

        function deleteSelected() {
            if (!confirm("削除しますか？")) return;
            const tx = db.transaction([STORE_NAME], "readwrite");
            const store = tx.objectStore(STORE_NAME);
            selectedIds.forEach(id => store.delete(id));
            tx.oncomplete = loadGallery;
        }

        function downloadSelected(encrypt) {
            const tx = db.transaction([STORE_NAME], "readonly");
            const store = tx.objectStore(STORE_NAME);
            selectedIds.forEach(id => {
                store.get(id).onsuccess = e => {
                    const item = e.target.result;
                    if (encrypt) downloadEncrypted(item);
                    else downloadNormal(item);
                };
            });
        }

        function getFileName(item, ext) {
            if (item.hasDate) {
                const d = new Date(item.timestamp);
                const p = n => n.toString().padStart(2,'0');
                return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
            } else {
                return `${Math.random().toString(36).slice(2)}.${ext}`;
            }
        }

        function downloadNormal(item) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(item.blob);
            a.download = getFileName(item, item.type === 'image' ? 'jpg' : 'mp4');
            a.click();
        }

        function downloadEncrypted(item) {
            const reader = new FileReader();
            reader.onload = () => {
                const data = {
                    t: item.type === 'image' ? 'img' : 'vid',
                    d: reader.result
                };
                const blob = new Blob([JSON.stringify(data)], {type:'application/octet-stream'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = Math.random().toString(36).slice(2) + ".dat";
                a.click();
            };
            reader.readAsDataURL(item.blob);
        }

        // 暗号化解除
        function triggerDecrypt() { document.getElementById('decrypt-input').click(); }
        function decryptFile(input) {
            if (!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    fetch(data.d).then(r=>r.blob()).then(blob => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = "restored_" + Date.now() + (data.t === 'img' ? '.jpg' : '.mp4');
                        a.click();
                    });
                } catch(e) { alert("復元失敗"); }
                input.value = '';
            };
            reader.readAsText(input.files[0]);
        }

        // 初期化
        window.onload = initDB;

    </script>
</body>
</html>
