<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NZC</title>
    <link rel="icon" href="NZC.jpg">
    <style>
        /* 全体のスタイル設定（黒背景・赤文字） */
        body {
            background-color: black;
            color: red;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: manipulation;
        }

        /* 共通UIパーツ */
        .screen {
            display: none;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        .active { display: block; }

        h1 {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 2em;
            letter-spacing: 5px;
        }

        h2 {
            text-align: center;
            border: 2px solid red;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            background: black;
            color: red;
            border: 2px solid red;
            padding: 15px;
            width: 100%;
            font-size: 1.2rem;
            margin-bottom: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        button:active {
            background: red;
            color: black;
        }

        button:disabled {
            border-color: #550000;
            color: #550000;
            cursor: default;
        }
        button:disabled:active {
            background: black;
        }

        input, select {
            background: black;
            color: red;
            border: 1px solid red;
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        /* 撮影モードレイヤー */
        #camera-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
            display: none;
            cursor: none;
        }

        /* 操作エリア（通常モード用） */
        /* JSで高さを動的に変更しますが、初期値として設定 */
        #touch-video-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 42.85%; /* 3/7 */
            z-index: 10000;
        }
        
        /* 真ん中の停止エリア（通常モード用 1/7） */
        #normal-stop-area {
            position: absolute;
            top: 42.85%;
            left: 0;
            width: 100%;
            height: 14.3%; /* 1/7 */
            z-index: 10002;
            display: none;
            /* background: rgba(50,0,0,0.5); デバッグ用可視化 */
        }

        #touch-photo-area {
            position: absolute;
            top: 57.15%; /* 4/7 */
            left: 0;
            width: 100%;
            height: 42.85%; /* 3/7 */
            z-index: 10000;
        }

        /* 中央の点滅ライン（停止時フィードバック用） */
        #flash-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #444; /* 暗めのグレー */
            z-index: 10005;
            opacity: 0;
            pointer-events: none;
        }
        /* 点滅アニメーション定義 */
        @keyframes flashAnim {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }
        .flashing {
            animation: flashAnim 0.3s ease-out forwards;
        }

        /* Quick V 停止用エリア (画面上部 1/6) */
        #quick-v-stop-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 16.66vh; /* 100% / 6 */
            z-index: 10001;
            display: none;
        }

        /* 処理用ビデオ要素 */
        #hidden-processing-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -1;
        }

        /* プレビュー設定画面 */
        video#preview-video {
            width: 100%;
            border: 1px solid red;
            margin-bottom: 10px;
            transform: scaleX(1);
        }

        /* フォルダ画面 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .gallery-item {
            border: 1px solid red;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .gallery-item.selected {
            border: 3px solid white;
        }
        .gallery-item img, .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-grow: 1;
        }
        .gallery-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: red;
            font-size: 0.7rem;
            text-align: center;
            padding: 2px 0;
            pointer-events: none;
        }

        .disclaimer {
            margin-top: 20px;
            border: 3px double red;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 0.8rem;
        }

        /* プレビューモーダル */
        #preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 20000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #preview-content {
            max-width: 100%;
            max-height: 80%;
            border: 2px solid red;
        }

        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <h1>NZC</h1>
        <button onclick="startNormalMode()">開始</button>
        <button onclick="startQuickVMode()">Quick V</button>
        
        <div style="height: 20px;"></div>
        
        <button onclick="showSettings()">設定</button>
        <button onclick="showFolder()">フォルダ</button>
        <button onclick="showUsage()">使用方法</button>
    </div>

    <div id="camera-overlay">
        <div id="touch-video-area"></div>
        <div id="normal-stop-area"></div>
        <div id="touch-photo-area"></div>

        <div id="quick-v-stop-area"></div>
        
        <div id="flash-line"></div> 
    </div>

    <div id="preview-modal">
        <div id="preview-container" style="width:100%; text-align:center;"></div>
        <button onclick="closePreview()" style="width: 50%; margin-top: 20px;">閉じる</button>
    </div>

    <video id="hidden-processing-video" autoplay playsinline muted></video>

    <div id="settings-screen" class="screen">
        <h2>設定</h2>
        <video id="preview-video" autoplay playsinline muted></video>
        
        <label>画質:</label>
        <select id="quality-select" onchange="initCamera(true)">
            <option value="ideal">標準 (HD)</option>
            <option value="max">高画質 (FHD/4K)</option>
            <option value="low">低画質 (SD)</option>
        </select>

        <label>カメラ:</label>
        <select id="camera-select" onchange="initCamera(true)"></select>

        <div style="margin-top: 15px; border-top: 1px solid #330000; padding-top: 10px;">
            <label style="display:block; margin: 10px 0; cursor: pointer; display: flex; align-items: center;">
                <input type="checkbox" id="date-record-toggle" style="width:20px; height:20px; margin-right:10px;"> 
                <span>ファイル名・表示に日付を使用</span>
            </label>

            <label style="display:block; margin: 10px 0; cursor: pointer; display: flex; align-items: center;">
                <input type="checkbox" id="fullscreen-toggle" checked style="width:20px; height:20px; margin-right:10px;"> 
                <span>自動フルスクリーン有効</span>
            </label>
        </div>

        <button onclick="goHome()">戻る</button>
    </div>

    <div id="folder-screen" class="screen">
        <h2>フォルダ</h2>
        <div style="margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap;">
            <button onclick="toggleSelectAll()" style="flex: 1; font-size:0.8rem; min-width: 80px;">全選択</button>
            <button onclick="downloadSelected()" style="flex: 1; font-size:0.8rem; min-width: 60px;">保存</button>
            <button onclick="deleteSelected()" style="flex: 1; font-size:0.8rem; min-width: 60px;">削除</button>
        </div>
        <button id="btn-preview-single" onclick="previewSelected()" style="display:none; margin-bottom:10px; background:#330000;">プレビュー</button>
        
        <div id="gallery" class="gallery-grid"></div>
        <br>
        <button onclick="goHome()">戻る</button>
    </div>

    <div id="usage-screen" class="screen">
        <h2>使用方法</h2>
        <div style="text-align: left; font-size: 0.9rem;">
            <p><b>【開始（通常モード）】</b><br>
            画面が真っ暗になります。画面を縦に7分割したとき：<br>
            ・上部(3/7): 動画録画 (タップで開始/停止)<br>
            ・<b>中部(1/7): 閉じる (ホームに戻る)</b><br>
            ・下部(3/7): 写真撮影 (タップで撮影)</p>
            
            <p><b>【Quick V】</b><br>
            押すと即座に真っ暗になり、<b>自動で録画開始</b>します。<br>
            <b>「画面の最上部(1/6)」をタップすると停止・終了</b>し、リロードされます。</p>
            
            <p><b>【フォルダ】</b><br>
            ・設定で日付ONの場合、撮影日時を表示。<br>
            ・1つだけ選択時「プレビュー」ボタン出現。</p>
        </div>
        <div class="disclaimer">悪用厳禁</div>
        <button onclick="goHome()">戻る</button>
    </div>

    <canvas id="hidden-canvas"></canvas>

    <script>
        // --- 設定・状態管理 ---
        const DB_NAME = "NZC_DB_v4";
        const STORE_NAME = "media";
        let db;
        
        let currentStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let isQuickMode = false;

        let settings = {
            quality: 'ideal',
            deviceId: null,
            recordDate: false,
            enableFullscreen: true
        };

        // --- IndexedDB (保存機能) ---
        function initDB() {
            const request = indexedDB.open(DB_NAME, 2);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = (e) => { db = e.target.result; };
        }

        function saveMedia(blob, type) {
            const transaction = db.transaction([STORE_NAME], "readwrite");
            const store = transaction.objectStore(STORE_NAME);
            store.add({
                type: type,
                blob: blob,
                timestamp: Date.now(),
                hasDate: document.getElementById('date-record-toggle').checked,
                mime: blob.type
            });
        }

        // --- バイブレーション機能 ---
        function vibrate(type) {
            if (!navigator.vibrate) return;
            if (type === 'short') navigator.vibrate(50);
            if (type === 'long') navigator.vibrate(800);
        }

        // --- 画面遷移とフルスクリーン ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goHome() {
            stopCamera();
            showScreen('menu-screen');
            document.getElementById('camera-overlay').style.display = 'none';
            document.getElementById('quick-v-stop-area').style.display = 'none';
            document.getElementById('normal-stop-area').style.display = 'none'; // 通常モード閉じるボタン非表示
            if (document.fullscreenElement) document.exitFullscreen().catch(e=>{});
            isQuickMode = false;
        }

        async function enterFullScreen() {
            // 設定で無効なら実行しない
            if (!document.getElementById('fullscreen-toggle').checked) return;

            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) { console.log("Fullscreen blocked"); }
        }

        // --- カメラ初期化プロセス ---
        async function getCameras() {
            const select = document.getElementById('camera-select');
            select.innerHTML = "";
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                videoDevices.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.text = d.label || `Camera ${select.length + 1}`;
                    select.appendChild(opt);
                });
            } catch (e) {}
        }

        async function initCamera(isPreview = false) {
            stopCamera();

            settings.quality = document.getElementById('quality-select').value;
            settings.deviceId = document.getElementById('camera-select').value;

            let w, h;
            if (settings.quality === 'max') { w = 1920; h = 1080; }
            else if (settings.quality === 'low') { w = 640; h = 480; }
            else { w = 1280; h = 720; }

            const constraints = {
                video: {
                    deviceId: settings.deviceId ? { exact: settings.deviceId } : undefined,
                    width: { ideal: w },
                    height: { ideal: h },
                    facingMode: settings.deviceId ? undefined : 'environment'
                },
                audio: true
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                if (isPreview) {
                    const v = document.getElementById('preview-video');
                    v.srcObject = currentStream;
                } else {
                    const v = document.getElementById('hidden-processing-video');
                    v.srcObject = currentStream;
                    await v.play(); 
                }
            } catch (err) {
                alert("カメラ起動失敗: " + err.message);
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            isRecording = false;
        }

        // --- モード制御 ---

        // 1. 通常モード
        async function startNormalMode() {
            await enterFullScreen();
            await initCamera(false);
            if (!currentStream) return;

            document.getElementById('camera-overlay').style.display = 'block';
            document.getElementById('quick-v-stop-area').style.display = 'none';
            
            // 通常モード用の停止エリア（中央）を表示
            const normalStopArea = document.getElementById('normal-stop-area');
            normalStopArea.style.display = 'block';
            normalStopArea.onclick = () => {
                vibrate('short');
                goHome(); // 中央タップでホームへ
            };

            isQuickMode = false;
            
            // タッチイベント有効化 (レイアウトはCSSで 3:1:3 に設定済)
            document.getElementById('touch-video-area').onclick = toggleVideoRecord;
            document.getElementById('touch-photo-area').onclick = takePhoto;
        }

        // 2. Quick V モード
        async function startQuickVMode() {
            await enterFullScreen();
            await initCamera(false);
            if (!currentStream) return;

            document.getElementById('camera-overlay').style.display = 'block';
            isQuickMode = true;

            // 通常エリアの無効化
            document.getElementById('touch-video-area').onclick = null;
            document.getElementById('touch-photo-area').onclick = null;
            document.getElementById('normal-stop-area').style.display = 'none';

            // 停止エリア(Top 1/6)の有効化
            const stopArea = document.getElementById('quick-v-stop-area');
            stopArea.style.display = 'block';
            stopArea.onclick = stopQuickVAndReload;

            // 自動録画開始
            startVideo();
        }

        // Quick V 停止処理
        function stopQuickVAndReload() {
            if (isRecording) {
                stopVideo();
                vibrate('long');
                // 保存完了を少し待ってからリロード
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                location.reload();
            }
        }

        // --- 撮影機能 ---

        function takePhoto() {
            if (isQuickMode && isRecording) return; 

            const video = document.getElementById('hidden-processing-video');
            if (!video || video.readyState < 2) return;

            const canvas = document.getElementById('hidden-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            canvas.toBlob(blob => {
                if (blob) {
                    saveMedia(blob, 'image');
                    vibrate('short');
                }
            }, 'image/jpeg', 0.9);
        }

        function toggleVideoRecord() {
            if (isRecording) {
                stopVideo();
                
                // --- 中央ライン点滅エフェクト (通常モード停止時) ---
                if (!isQuickMode) {
                    const line = document.getElementById('flash-line');
                    // アニメーションをリセットして再生
                    line.classList.remove('flashing');
                    void line.offsetWidth; // リフロー発生
                    line.classList.add('flashing');
                }
            }
            else {
                startVideo();
            }
        }

        function startVideo() {
            if (!currentStream) return;
            recordedChunks = [];
            
            let mime = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) mime = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mime = 'video/webm;codecs=vp9';

            try {
                mediaRecorder = new MediaRecorder(currentStream, { mimeType: mime });
            } catch (e) {
                mediaRecorder = new MediaRecorder(currentStream);
            }

            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                saveMedia(blob, 'video');
                vibrate('long');
            };

            mediaRecorder.start();
            isRecording = true;
            vibrate('short');
        }

        function stopVideo() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        // --- ギャラリー・ダウンロードなど ---
        function showSettings() { showScreen('settings-screen'); getCameras(); initCamera(true); }
        function showFolder() { showScreen('folder-screen'); loadGallery(); }
        function showUsage() { showScreen('usage-screen'); }

        let selectedIds = new Set();
        let allItemIds = []; // 全選択用

        function loadGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "";
            selectedIds.clear();
            allItemIds = [];
            updateFolderButtons();

            const tx = db.transaction([STORE_NAME], "readonly");
            const store = tx.objectStore(STORE_NAME);
            
            store.openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const item = cursor.value;
                    allItemIds.push(item.id);

                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.dataset.id = item.id;
                    
                    div.onclick = () => {
                        if (selectedIds.has(item.id)) {
                            selectedIds.delete(item.id);
                            div.classList.remove('selected');
                        } else {
                            selectedIds.add(item.id);
                            div.classList.add('selected');
                        }
                        updateFolderButtons();
                    };

                    const url = URL.createObjectURL(item.blob);
                    
                    let contentHtml = "";
                    if (item.type === 'image') contentHtml = `<img src="${url}">`;
                    else contentHtml = `<video src="${url}"></video>`;

                    let typeLabel = item.type === 'image' ? '画像' : '動画';
                    let dateLabel = "";
                    
                    if (item.hasDate) {
                        const d = new Date(item.timestamp);
                        const p = n => n.toString().padStart(2,'0');
                        dateLabel = `<br>${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
                    }
                    
                    const metaHtml = `<div class="gallery-meta">${typeLabel}${dateLabel}</div>`;

                    div.innerHTML = contentHtml + metaHtml;
                    gallery.appendChild(div);
                    
                    cursor.continue();
                }
            };
        }

        function updateFolderButtons() {
            const previewBtn = document.getElementById('btn-preview-single');
            if (selectedIds.size === 1) {
                previewBtn.style.display = 'block';
            } else {
                previewBtn.style.display = 'none';
            }
        }

        function toggleSelectAll() {
            const items = document.querySelectorAll('.gallery-item');
            if (selectedIds.size === allItemIds.length) {
                selectedIds.clear();
                items.forEach(div => div.classList.remove('selected'));
            } else {
                allItemIds.forEach(id => selectedIds.add(id));
                items.forEach(div => div.classList.add('selected'));
            }
            updateFolderButtons();
        }

        // --- プレビュー機能 ---
        function previewSelected() {
            if (selectedIds.size !== 1) return;
            const id = Array.from(selectedIds)[0];
            
            const tx = db.transaction([STORE_NAME], "readonly");
            const store = tx.objectStore(STORE_NAME);
            store.get(id).onsuccess = e => {
                const item = e.target.result;
                const url = URL.createObjectURL(item.blob);
                const container = document.getElementById('preview-container');
                container.innerHTML = "";

                if (item.type === 'image') {
                    const img = document.createElement('img');
                    img.src = url;
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '80vh';
                    container.appendChild(img);
                } else {
                    const vid = document.createElement('video');
                    vid.src = url;
                    vid.controls = true;
                    vid.autoplay = true;
                    vid.style.maxWidth = '100%';
                    vid.style.maxHeight = '80vh';
                    container.appendChild(vid);
                }
                document.getElementById('preview-modal').style.display = 'flex';
            };
        }

        function closePreview() {
            const container = document.getElementById('preview-container');
            container.innerHTML = ""; 
            document.getElementById('preview-modal').style.display = 'none';
        }

        function deleteSelected() {
            if (selectedIds.size === 0) return;
            if (!confirm("選択した項目を削除しますか？")) return;
            const tx = db.transaction([STORE_NAME], "readwrite");
            const store = tx.objectStore(STORE_NAME);
            selectedIds.forEach(id => store.delete(id));
            tx.oncomplete = loadGallery;
        }

        function downloadSelected() {
            if (selectedIds.size === 0) return;
            const tx = db.transaction([STORE_NAME], "readonly");
            const store = tx.objectStore(STORE_NAME);
            selectedIds.forEach(id => {
                store.get(id).onsuccess = e => {
                    downloadNormal(e.target.result);
                };
            });
        }

        function getFileName(item, ext) {
            if (item.hasDate) {
                const d = new Date(item.timestamp);
                const p = n => n.toString().padStart(2,'0');
                return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
            } else {
                return `${Math.random().toString(36).slice(2)}.${ext}`;
            }
        }

        function downloadNormal(item) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(item.blob);
            let ext = item.type === 'image' ? 'jpg' : 'mp4';
            if (item.type === 'video' && item.mime && item.mime.includes('webm')) ext = 'webm';
            
            a.download = getFileName(item, ext);
            a.click();
        }

        window.onload = initDB;

    </script>
